version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardvarx-postgres
    restart: always
    environment:
      POSTGRES_USER: guardvarx_user
      POSTGRES_PASSWORD: guardvarx_secure_pass
      POSTGRES_DB: guardvarx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardvarx_user -d guardvarx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardvarx-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: guardvarx_user
      DB_PASSWORD: guardvarx_secure_pass
      DB_NAME: guardvarx_db
      DB_SSLMODE: disable
      ALLOW_MOCK_AUTH: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
